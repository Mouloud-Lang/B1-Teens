<script>

  let currentWord = "";
  let cachedPdfBlob = null;
  let cachedShareText = "";

  function speakBritish(text) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    setTimeout(function() {
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-GB";
      utter.rate = 0.92;
      utter.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const gbVoice = voices.find(function(v) {
        return v.lang === "en-GB" && (
          v.name.indexOf("Google") !== -1 ||
          v.name.indexOf("Daniel") !== -1 ||
          v.name.indexOf("Natural") !== -1 ||
          v.name.indexOf("Kate") !== -1
        );
      }) || voices.find(function(v) {
        return v.lang === "en-GB" || v.lang.indexOf("en_GB") === 0;
      }) || voices.find(function(v) {
        return v.lang.indexOf("en") === 0;
      });

      if (gbVoice) utter.voice = gbVoice;
      window.speechSynthesis.speak(utter);
    }, 35);
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = function() {
      window.speechSynthesis.getVoices();
    };
  }

  function renderStory() {
    const container = document.getElementById("storyContainer");
    container.innerHTML = "";

    STORY_PARAGRAPHS.forEach(function(para) {
      const pEl = document.createElement("p");
      const parts = para.split(/([A-Za-z']+)/);

      parts.forEach(function(part) {
        if (!part) return;
        if (/^[A-Za-z']+$/.test(part)) {
          const span = document.createElement("span");
          span.className = "w-token";
          span.textContent = part;
          span.onclick = function() {
            handleWordTap(span, part);
          };
          pEl.appendChild(span);
        } else {
          pEl.appendChild(document.createTextNode(part));
        }
      });

      container.appendChild(pEl);
    });
  }

  function handleWordTap(el, rawWord) {
    document.querySelectorAll(".w-token.active-word").forEach(function(t) {
      t.classList.remove("active-word");
    });
    el.classList.add("active-word");

    const cleanKey = rawWord.toLowerCase();
    currentWord = rawWord;

    const meaning = DICT[cleanKey] || "a word from the story";
    document.getElementById("dockWord").textContent = rawWord;
    document.getElementById("dockMeaning").textContent = meaning;
    document.getElementById("defDock").classList.add("visible");

    speakBritish(rawWord);
  }

  function replayCurrentWord() {
    if (currentWord) {
      speakBritish(currentWord);
    }
  }

  function closeDefDock() {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    document.getElementById("defDock").classList.remove("visible");
    document.querySelectorAll(".w-token.active-word").forEach(function(t) {
      t.classList.remove("active-word");
    });
  }

  function readFullStory() {
    closeDefDock();
    speakBritish(STORY_PARAGRAPHS.join(" "));
  }

  function wrapLines(ctx, text, maxWidth) {
    const words = text.split(/\s+/);
    const lines = [];
    let line = "";
    for (let i = 0; i < words.length; i++) {
      const testLine = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = words[i];
      } else {
        line = testLine;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  function buildWorksheetPdfBlob(qaItems) {
    const pageW = 1240;
    const pageH = 1754;
    const margin = 80;
    const contentW = pageW - margin * 2;

    const pages = [];
    function newPage() {
      const c = document.createElement("canvas");
      c.width = pageW;
      c.height = pageH;
      const cx = c.getContext("2d");
      cx.fillStyle = "#FFFFFF";
      cx.fillRect(0, 0, pageW, pageH);
      cx.fillStyle = "#1E1B4B";
      cx.fillRect(0, 0, pageW, 18);
      pages.push(c);
      return cx;
    }

    let ctx = newPage();
    let y = 90;

    ctx.fillStyle = "#1E1B4B";
    ctx.font = "bold 40px Georgia, serif";
    ctx.fillText("The North Wind and the Sun — Retelling Answers", margin, y);
    y += 38;

    ctx.strokeStyle = "#CBD5E1";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(margin, y);
    ctx.lineTo(pageW - margin, y);
    ctx.stroke();
    y += 45;

    qaItems.forEach(function(item, idx) {
      ctx.font = "bold 26px Arial, sans-serif";
      const qLines = wrapLines(ctx, (idx + 1) + ". " + item.question, contentW - 30);

      ctx.font = "24px Georgia, serif";
      const ansText = item.answer ? item.answer : "(No answer written)";
      const aLines = wrapLines(ctx, ansText, contentW - 40);

      const blockH = qLines.length * 36 + aLines.length * 34 + 54;
      if (y + blockH > pageH - 80) {
        ctx = newPage();
        y = 85;
      }

      ctx.fillStyle = "#F8FAFC";
      ctx.strokeStyle = "#CBD5E1";
      ctx.lineWidth = 2;
      ctx.fillRect(margin, y - 28, contentW, blockH - 16);
      ctx.strokeRect(margin, y - 28, contentW, blockH - 16);

      ctx.fillStyle = "#1E1B4B";
      ctx.font = "bold 26px Arial, sans-serif";
      qLines.forEach(function(line) {
        ctx.fillText(line, margin + 18, y);
        y += 36;
      });

      y += 6;
      ctx.fillStyle = item.answer ? "#0F172A" : "#94A3B8";
      ctx.font = "24px Georgia, serif";
      aLines.forEach(function(line) {
        ctx.fillText(line, margin + 24, y);
        y += 34;
      });

      y += 34;
    });

    const pageJpegs = pages.map(function(c) {
      const dataUrl = c.toDataURL("image/jpeg", 0.92);
      const bin = atob(dataUrl.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return { bytes: bytes, w: c.width, h: c.height };
    });

    const encoder = new TextEncoder();
    const chunks = [];
    const offsets = [0];
    let byteLen = 0;

    function pushStr(s) {
      const b = encoder.encode(s);
      chunks.push(b);
      byteLen += b.length;
    }
    function pushBytes(b) {
      chunks.push(b);
      byteLen += b.length;
    }
    function startObj(id) {
      offsets[id] = byteLen;
      pushStr(id + " 0 obj\n");
    }

    pushStr("%PDF-1.4\n");

    const n = pageJpegs.length;
    const kids = [];
    for (let i = 0; i < n; i++) kids.push((3 + i * 3) + " 0 R");

    startObj(1);
    pushStr("<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");

    startObj(2);
    pushStr("<< /Type /Pages /Kids [ " + kids.join(" ") + " ] /Count " + n + " >>\nendobj\n");

    for (let i = 0; i < n; i++) {
      const pObj = 3 + i * 3;
      const cObj = 4 + i * 3;
      const imObj = 5 + i * 3;
      const jpg = pageJpegs[i];

      startObj(pObj);
      pushStr("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 " + imObj + " 0 R >> >> /Contents " + cObj + " 0 R >>\nendobj\n");

      const streamStr = "q 595.28 0 0 841.89 0 0 cm /Im0 Do Q\n";
      startObj(cObj);
      pushStr("<< /Length " + streamStr.length + " >>\nstream\n" + streamStr + "endstream\nendobj\n");

      startObj(imObj);
      pushStr("<< /Type /XObject /Subtype /Image /Width " + jpg.w + " /Height " + jpg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.bytes.length + " >>\nstream\n");
      pushBytes(jpg.bytes);
      pushStr("\nendstream\nendobj\n");
    }

    const totalObjs = 2 + n * 3;
    const xrefPos = byteLen;
    pushStr("xref\n0 " + (totalObjs + 1) + "\n0000000000 65535 f \n");
    for (let i = 1; i <= totalObjs; i++) {
      pushStr(String(offsets[i]).padStart(10, "0") + " 00000 n \n");
    }
    pushStr("trailer\n<< /Size " + (totalObjs + 1) + " /Root 1 0 R >>\nstartxref\n" + xrefPos + "\n%%EOF");

    return new Blob(chunks, { type: "application/pdf" });
  }

  function prepareAndSharePDF() {
    const questions = [
      "Who were the two characters in the story, and what did they argue about?",
      "Who did they see walking down the road, and what was he wearing?",
      "What game or test did the North Wind and the Sun decide to play?",
      "What did the North Wind do first, and how did the young man react?",
      "What did the Sun do next, and why did the man take off his coat?",
      "Who won the contest, and what lesson does this story teach us?"
    ];

    const qaItems = questions.map(function(q, idx) {
      const val = document.getElementById("ans" + (idx + 1)).value.trim();
      return { question: q, answer: val };
    });

    cachedPdfBlob = buildWorksheetPdfBlob(qaItems);

    const summaryLines = qaItems.map(function(item, idx) {
      return (idx + 1) + ". " + item.question + "\nAnswer: " + (item.answer || "—");
    }).join("\n\n");

    cachedShareText = "The North Wind and the Sun — Retelling Answers:\n\n" + summaryLines;
    const encodedText = encodeURIComponent(cachedShareText);
    const encodedSubject = encodeURIComponent("The North Wind and the Sun — Story Retelling");

    document.getElementById("waLink").href = "https://api.whatsapp.com/send?text=" + encodedText;
    document.getElementById("tgLink").href = "https://t.me/share/url?url=" + encodeURIComponent("https://fable-reader") + "&text=" + encodedText;
    document.getElementById("vkLink").href = "https://vk.com/share.php?title=" + encodedSubject + "&comment=" + encodedText;
    document.getElementById("mailLink").href = "mailto:?subject=" + encodedSubject + "&body=" + encodedText;

    const panel = document.getElementById("sharePanel");
    panel.style.display = "block";
    panel.scrollIntoView({ behavior: "smooth", block: "center" });

    shareNativeFile();
  }

  async function shareNativeFile() {
    if (!cachedPdfBlob) return;
    const pdfFile = new File([cachedPdfBlob], "North_Wind_and_Sun_Retelling.pdf", {
      type: "application/pdf"
    });

    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      try {
        await navigator.share({
          title: "The North Wind and the Sun — Retelling",
          text: "Here are my answers for The North Wind and the Sun.",
          files: [pdfFile]
        });
      } catch (err) {
        // User cancelled share sheet; social buttons remain visible below
      }
    }
  }

  renderStory();
</script>
